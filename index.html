<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c3a">
<meta name="description" content="Menús semanales para una persona, recetas y lista de la compra con precios de Mercadona y Carrefour.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menú del mes">
<title>Menú del mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: practical, warm kitchen planner for one person
   IDEA: the weekly planner stuck on the fridge, with the market list beside it
   PICTURE: the week board itself, days with hanging names and colour-coded meals
   COLOUR and TYPE: market green field, tomato accent, white ground; Archivo 800 + 400
   LAYOUT: green header band with actions, week tabs, board, then the shopping list in columns */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1511);--ink:light-dark(#17201a,#e8eee9);--mut:light-dark(#5a685e,#9fb0a4);--line:light-dark(#e2e8e3,#27322b);--card:light-dark(#f4f8f5,#162019);--green:light-dark(#1f5c3a,#163d27);--tom:#e8452c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.top{background:var(--green);color:#fff;padding-bottom:clamp(20px,3vw,36px);padding-top:max(clamp(24px,4vw,56px),env(safe-area-inset-top));padding-left:max(5vw,16px,env(safe-area-inset-left));padding-right:max(5vw,16px,env(safe-area-inset-right))}
body{padding-bottom:env(safe-area-inset-bottom)}
.inst{display:none}.inst.show{display:inline-flex}
.top .wrap{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(34px,5vw,52px);line-height:1.05;font-weight:800;margin:0;text-wrap:balance}
.top p{margin:8px 0 0;max-width:60ch;opacity:.88}
.act{display:flex;gap:10px;flex-wrap:wrap}
.pri,.sec{min-height:46px;padding:0 20px;border-radius:12px;font-weight:600;border:0}
.pri{background:var(--tom);color:#fff}
.pri:hover{filter:brightness(1.08)}
.top .sec{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff}
.sec{background:var(--card);border:1px solid var(--line)}
.sec:disabled{opacity:.4;cursor:default}
.note{background:var(--tom);color:#fff;border-radius:10px;padding:8px 14px;margin-top:14px;display:inline-block;font-weight:500}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-block:20px 0}
.tab{min-height:56px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;display:flex;flex-direction:column;line-height:1.2}
.tab span{font-size:13px;color:var(--mut)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.on span{color:inherit;opacity:.75}
h2{font-size:clamp(26px,3vw,32px);line-height:1.1;margin:0 0 6px;font-weight:800}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip i,.k i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.day{display:grid;grid-template-columns:8.5rem minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day.head{border:0;padding:0 0 4px;font-size:13px;color:var(--mut);font-weight:600}
.dn{font-weight:800;font-size:20px;line-height:1.1;padding-top:10px}
.dn small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:3px}
.slot{position:relative}
.ml{display:none;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:4px}
.meal{display:block;width:100%;height:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 50px 12px 14px;min-height:68px}
.meal:hover{border-color:var(--mut)}
.k{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.meal b{display:block;font-size:17px;font-weight:600;line-height:1.25;margin-top:3px}
.sw{position:absolute;right:6px;bottom:12px;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--mut);font-size:20px}
.sw:hover{background:var(--line);color:var(--ink)}
.fresh .day{animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.fresh .day{animation:none}}
.shopband{background:var(--card);border-top:1px solid var(--line)}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.shead p{margin:0;color:var(--mut);max-width:62ch}
.cols{columns:250px 3;column-gap:36px}
.grp{break-inside:avoid;margin-bottom:24px}
.grp h3{font-size:17px;margin:0 0 6px;font-weight:800;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.grp ul{list-style:none;margin:0;padding:0}
.grp label{display:flex;gap:10px;align-items:center;min-height:40px;border-bottom:1px solid var(--line);cursor:pointer}
.grp input{width:20px;height:20px;accent-color:var(--tom);flex:none}
.q{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut);text-align:right}
.done span{text-decoration:line-through;opacity:.5}
.pantry{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
dialog{border:0;border-radius:18px;padding:0;width:min(680px,calc(100% - 24px));background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.dh{background:var(--green);color:#fff;padding:22px 24px}
.dh .k{color:#fff;opacity:.85}
.dh h3{font-size:clamp(24px,4vw,32px);line-height:1.1;margin:6px 0 0;font-weight:800}
.db{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:20px 24px}
.db h4{margin:0 0 6px;font-size:15px}
.db ul{list-style:none;margin:0;padding:0}
.db li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.db li.pt{color:var(--mut);font-size:13px;border:0}
.db p{margin:0}
.df{display:flex;gap:10px;justify-content:flex-end;padding:0 24px 22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.pb{padding:18px 24px;max-height:62vh;overflow:auto}
.pb h4{margin:18px 0 8px;font-size:15px}.pb h4:first-child{margin-top:0}
.pc{display:flex;flex-wrap:wrap;gap:8px}
.pt,.pg{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.pt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pg.no{background:var(--tom);color:#fff;border-color:var(--tom)}
.pg.si{background:#2f8a4a;color:#fff;border-color:#2f8a4a}
.hint{font-size:14px;color:var(--mut);margin:0 0 8px}
.pb input{width:100%;min-height:44px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:inherit;margin-bottom:10px}
#pi{max-height:260px;overflow:auto;padding:2px}
.pn{flex:1 1 200px;align-self:center;color:var(--mut);font-size:14px}
.tots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:12px}
.tot{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);min-height:84px}
.tot span{font-weight:600}.tot b{font-size:clamp(24px,3vw,30px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.tot small{font-size:13px;color:var(--mut)}
.tot.on{border:2px solid var(--ink)}
.tot.best b{color:var(--tom)}
.fine{font-size:14px;color:var(--mut);margin:0 0 22px;max-width:90ch}
.fine b{color:var(--ink)}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:14px}
.grp li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.grp li label{flex:1;border:0}
.nm small{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pe{min-height:40px;min-width:68px;padding:0 8px;border-radius:8px;border:1px dashed var(--line);background:transparent;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pe:hover{border-color:var(--mut)}
.pe.none{color:var(--tom);font-size:14px}
.xr{border:1px solid var(--line);border-radius:12px;padding:8px 12px 4px;margin:0 0 12px;display:grid;grid-template-columns:1fr 1fr auto;gap:0 10px;align-items:end}
.xr legend{font-weight:700;padding:0 4px}
.xr label{font-size:13px;color:var(--mut)}
.xr .wide{grid-column:1/-1}
.xr .cb{display:flex;gap:6px;align-items:center;min-height:44px;margin-bottom:10px;color:var(--ink);font-size:15px}
.xr .cb input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--tom)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg{flex-wrap:wrap}
.sb{min-height:46px;padding:0 14px;border:0;background:var(--bg);font-weight:600}
.sb+.sb{border-left:1px solid var(--line)}
.sb[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.filt{font-size:14px;color:var(--mut);margin:-6px 0 14px}
.filt b{color:var(--ink);font-weight:600}
.warn{color:var(--tom);font-weight:600}
@media(max-width:600px){.day{grid-template-columns:minmax(0,1fr)}.day.head{display:none}.ml{display:block}.dn{padding-top:4px}.db{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="band top">
  <div class="wrap">
    <div>
      <h1>Menú del mes</h1>
      <p id="sub">Comida y cena para una persona, cuatro semanas sin repetir plato. Pulsa un plato para ver la receta.</p>
      <div id="note"></div>
    </div>
    <div class="act">
      <button id="prefs" class="sec">Mis preferencias</button>
      <button id="inst" class="sec inst">Instalar app</button>
      <button id="mix" class="pri">Mezclar menús</button>
      <button id="undo" class="sec">Deshacer</button>
    </div>
  </div>
</header>
<div class="wrap" style="padding-inline:max(5vw,16px)"><nav class="tabs" id="tabs" aria-label="Semanas"></nav></div>
<main>
  <section class="band" style="padding-top:24px">
    <div class="wrap">
      <h2 id="wt">Semana 1</h2>
      <div class="sum" id="sum"></div>
      <p class="filt" id="filt"></p>
      <div id="board"></div>
    </div>
  </section>
  <section class="band shopband">
    <div class="wrap">
      <div class="shead">
        <div><h2 id="st">Lista de la compra</h2><p>Cantidades para los platos de esta semana más desayunos y fruta. Lo de despensa dura más: compra solo si se acaba.</p></div>
        <div class="act"><button class="sec" id="clear">Desmarcar</button><span class="seg" role="group" aria-label="Comprar en"><button class="sb" data-b="m">Mercadona</button><button class="sb" data-b="c">Carrefour</button><button class="sb" data-b="d">Carrefour Drive</button><button class="sb" data-b="">Comparar</button></span><button class="sec" id="order">Copiar pedido</button><button class="pri" id="copy">Copiar lista</button></div>
      </div>
      <div class="tots" id="tots" role="tablist" aria-label="Supermercado"></div>
      <p class="fine" id="fine"></p>
      <div class="cols" id="shop"></div>
    </div>
  </section>
</main>
<dialog id="dlg"></dialog>
<dialog id="pdlg"></dialog>
<dialog id="xdlg"></dialog>
<div class="toast" id="toast"></div>
<script>
{

const PANTRY=["Aceite de oliva virgen extra","Sal","Pimienta","Pimentón dulce","Comino","Curry","Orégano","Azafrán","Laurel","Vinagre","Salsa de soja","Pan rallado","Harina","Café o infusiones"];

const DB={l:{
leg:[
["Garbanzos con espinacas",25,"Garbanzos cocidos|250|g|d;Espinacas frescas|150|g|v;Ajo (dientes)|2|ud|v","Dora los ajos laminados en aceite, añade una cucharadita de pimentón y otra de comino y enseguida las espinacas hasta que bajen. Incorpora los garbanzos escurridos con un chorrito de agua y deja 5 minutos a fuego suave."],
["Lentejas estofadas con verduras",40,"Lentejas pardinas|90|g|d;Zanahorias|1|ud|v;Pimiento verde|1|ud|v;Cebolla|0.5|ud|v;Patatas|150|g|v;Ajo (dientes)|1|ud|v","Sofríe cebolla, pimiento y ajo picados. Añade la zanahoria y la patata en dados, las lentejas lavadas, una hoja de laurel, pimentón y agua que las cubra el doble. Cuece 30 a 35 minutos a fuego medio."],
["Alubias blancas con almejas",25,"Alubias blancas cocidas|250|g|d;Almejas|150|g|p;Cebolla|0.5|ud|v;Ajo (dientes)|2|ud|v;Perejil fresco|0.25|manojo|v","Pocha la cebolla y el ajo, añade una cucharadita de harina y un vaso de agua o caldo. Incorpora las alubias; cuando hierva echa las almejas lavadas y tapa hasta que se abran. Termina con perejil picado."],
["Ensalada templada de garbanzos y atún",15,"Garbanzos cocidos|200|g|d;Atún en lata|1|lata|d;Tomates|1|ud|v;Pepino|0.5|ud|v;Cebolla morada|0.25|ud|v;Huevos|1|ud|l","Cuece el huevo 10 minutos. Saltea los garbanzos 2 minutos con aceite y comino. Mezcla con tomate, pepino, cebolla, atún y el huevo troceado; aliña con aceite, vinagre y sal."],
["Lentejas rojas al curry con arroz",30,"Lentejas rojas|80|g|d;Leche de coco|100|ml|d;Cebolla|0.5|ud|v;Tomate triturado|100|g|d;Arroz basmati|50|g|d;Ajo (dientes)|1|ud|v","Sofríe cebolla y ajo con una cucharada de curry. Añade las lentejas, el tomate, la leche de coco y 250 ml de agua; cuece 15 a 20 minutos hasta que se deshagan. Sirve con el arroz cocido."],
["Potaje de garbanzos con bacalao",35,"Garbanzos cocidos|250|g|d;Bacalao desalado|120|g|p;Espinacas frescas|100|g|v;Cebolla|0.5|ud|v;Huevos|1|ud|l","Sofríe la cebolla con pimentón, añade los garbanzos y agua o caldo hasta cubrir. Cuando hierva, incorpora las espinacas y el bacalao en trozos; 8 minutos a fuego suave. Sirve con el huevo duro picado."],
["Fabada ligera",30,"Alubias blancas cocidas|250|g|d;Chorizo|40|g|c;Lacón o jamón en taco|40|g|c;Cebolla|0.5|ud|v","Dora el chorizo y el lacón en trozos con la cebolla picada. Añade las alubias, agua hasta cubrir y unas hebras de azafrán. Cuece 20 minutos a fuego suave, moviendo la cazuela en vez de remover."],
["Bowl de hummus con pollo",25,"Garbanzos cocidos|200|g|d;Tahini|20|g|d;Limones|0.5|ud|v;Pechuga de pollo|120|g|c;Pepino|0.5|ud|v;Tomates cherry|100|g|v;Ajo (dientes)|1|ud|v","Tritura los garbanzos con tahini, el zumo del limón, el ajo, aceite y un poco de agua hasta que quede cremoso. Haz el pollo a la plancha en tiras con pimentón. Monta el bol con hummus, pollo, pepino y tomates."],
["Lentejas con arroz y calabacín",35,"Lentejas pardinas|70|g|d;Arroz|40|g|d;Calabacín|0.5|ud|v;Cebolla|0.5|ud|v;Zanahorias|1|ud|v","Sofríe cebolla, zanahoria y calabacín picados. Añade las lentejas y el triple de su volumen en agua, cuece 20 minutos, incorpora el arroz y cuece 15 minutos más."],
["Chili de alubias rojas con arroz",30,"Alubias rojas cocidas|250|g|d;Tomate triturado|150|g|d;Pimiento rojo|0.5|ud|v;Cebolla|0.5|ud|v;Maíz dulce|0.5|lata|d;Arroz|50|g|d","Sofríe cebolla y pimiento con comino, pimentón y una pizca de picante. Añade el tomate, las alubias y el maíz; 15 minutos a fuego suave. Sirve con el arroz cocido."],
["Ensalada de lentejas y feta",15,"Lentejas cocidas|250|g|d;Pimiento rojo|0.5|ud|v;Tomates|1|ud|v;Queso feta|40|g|l;Cebolla morada|0.25|ud|v","Enjuaga las lentejas. Mézclalas con las verduras en dados y el feta desmenuzado. Aliña con aceite, vinagre, orégano y sal."]],
arr:[
["Arroz con pollo y verduras",40,"Arroz|80|g|d;Muslo de pollo deshuesado|150|g|c;Pimiento rojo|0.5|ud|v;Judías verdes|80|g|v;Tomate triturado|80|g|d;Caldo de pollo|250|ml|d","Dora el pollo troceado, añade pimiento y judías, luego el tomate y pimentón. Incorpora el arroz, rehógalo un minuto y cubre con el caldo caliente y azafrán. 18 minutos de cocción y 5 de reposo."],
["Paella de marisco",40,"Arroz|80|g|d;Gambas|100|g|p;Calamar|100|g|p;Pimiento rojo|0.5|ud|v;Tomate triturado|80|g|d;Caldo de pescado|250|ml|d","Saltea las gambas y resérvalas. Sofríe calamar y pimiento, añade tomate, el arroz y el caldo caliente con azafrán. 18 minutos sin remover; pon las gambas encima al final y deja reposar 5 minutos."],
["Arroz caldoso de verduras",35,"Arroz|70|g|d;Alcachofas|2|ud|v;Calabacín|0.5|ud|v;Champiñones|100|g|v;Cebolla|0.5|ud|v;Caldo de verduras|400|ml|d","Sofríe cebolla, champiñones, calabacín y las alcachofas limpias en cuartos. Añade el arroz y el caldo caliente; cuece 18 minutos. Debe quedar meloso, con caldo."],
["Arroz tres delicias casero",25,"Arroz|80|g|d;Huevos|1|ud|l;Jamón cocido|50|g|c;Guisantes|60|g|g;Zanahorias|1|ud|v","Cuece el arroz y deja que se enfríe (mejor si es del día anterior). Haz una tortilla fina y córtala en tiras. Saltea la zanahoria picada, los guisantes y el jamón, añade el arroz, la tortilla y un chorrito de soja."],

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const used=()=>new Set(S.plan.weeks.flatMap(w=>w.l.concat(w.d)));
const dateOf=(w,i)=>new Date(S.plan.start+(w*7+i)*DAY+3600e3*3);
const fd=d=>d.getDate()+" "+MES[d.getMonth()];
const today=new Date();today.setHours(0,0,0,0);
let W=Math.min(3,Math.max(0,Math.floor((today-S.plan.start)/(7*DAY))));
const FR={0.25:"¼",0.5:"½",0.75:"¾",1.5:"1½"};
function fr(q,u){if(u==="g"||u==="ml")return q+" "+u;return(FR[q]||q)+" "+(u==="ud"?"ud":u)}
function fq(q,u){
  const k=v=>String(Math.round(v/100)/10).replace(".",",");
  if(u==="g")return q>=1000?k(q)+" kg":(q<100?Math.round(q/5)*5:Math.round(q/10)*10)+" g";
  if(u==="ml")return q>=1000?k(q)+" l":Math.round(q/10)*10+" ml";
  const n=Math.ceil(q-1e-9);
  return n+" "+(u==="ud"?"ud":n>1?(u==="lata"?"latas":"manojos"):u);
}
function shop(w){
  const map=new Map(),wk=S.plan.weeks[w];
  const add=g=>{const k=g.n+"|"+g.u;const o=map.get(k)||{k,n:g.n,u:g.u,c:g.c,q:0};o.q+=g.q;map.set(k,o)};
  pi(BASICS).filter(g=>!ingBlocked(g.n,S.prefs)).forEach(add);
  wk.l.concat(wk.d).forEach(id=>R[id].ing.forEach(add));
  return[...map.values()];
}
function mealB(m,i,id){
  const r=R[id];
  return`<div class="slot"><span class="ml">${m==="l"?"Comida":"Cena"}</span><button class="meal" data-id="${id}" data-m="${m}" data-i="${i}"><span class="k"><i style="background:${T[r.t][1]}"></i>${T[r.t][0]} · ${r.min} min</span><b>${r.n}</b></button><button class="sw" data-m="${m}" data-i="${i}" title="Cambiar este plato" aria-label="Cambiar ${r.n}">↻</button></div>`;
}
function render(fresh){
  const p=S.plan,wk=p.weeks[W];
  const end=dateOf(3,6);
  $("#note").innerHTML=today>end?`<span class="note">Este mes ya terminó: pulsa Mezclar menús para el siguiente.</span>`:"";
  $("#sub").textContent=`Comida y cena para una persona del ${fd(dateOf(0,0))} al ${fd(end)}, sin repetir plato. Pulsa un plato para ver la receta; ↻ lo cambia por otro.`;
  $("#tabs").innerHTML=[0,1,2,3].map(w=>`<button class="tab${w===W?" on":""}" data-w="${w}"><b>Semana ${w+1}</b><span>${fd(dateOf(w,0))} – ${fd(dateOf(w,6))}</span></button>`).join("");
  $("#wt").textContent=`Semana ${W+1}`;
  const all=wk.l.concat(wk.d).map(id=>R[id].t),cnt={};all.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  $("#sum").innerHTML=Object.keys(T).filter(t=>cnt[t]).map(t=>`<span class="chip"><i style="background:${T[t][1]}"></i>${T[t][0]} ×${cnt[t]}</span>`).join("");
  const P=S.prefs,fl=[];
  if(P.al.length)fl.push("<b>Sin:</b> "+P.al.map(a=>RU[a].l.replace(/^Sin /,"")).join(", "));
  if(P.no.length)fl.push("<b>No me gusta:</b> "+P.no.join(", "));
  if(P.si.length)fl.push("<b>Me gusta:</b> "+P.si.join(", "));
  if(wordsOf(P).length)fl.push("<b>Evitar:</b> "+P.words.replace(/[<>&"]/g,""));
  if(p.rep)fl.push(`<span class="warn">Con tus preferencias hay ${p.rep} repeticiones este mes</span>`);
  $("#filt").innerHTML=fl.length?fl.join(" · "):"Sin preferencias: pulsa Mis preferencias para indicar alergias o lo que no te gusta.";
  const b=$("#board");
  b.innerHTML=`<div class="day head"><span></span><span>Comida</span><span>Cena</span></div>`+DAYS.map((d,i)=>`<div class="day" style="animation-delay:${i*40}ms"><div class="dn">${d}<small>${fd(dateOf(W,i))}</small></div>${mealB("l",i,wk.l[i])}${mealB("d",i,wk.d[i])}</div>`).join("");
  b.classList.remove("fresh");if(fresh){void b.offsetWidth;b.classList.add("fresh")}
  $("#st").textContent=`Lista de la compra · semana ${W+1}`;
  const ch=S.checks[W]||{},PL=priced(W),TT=totals(PL),md=S.buy?SRC(S.buy):S.mode;
  document.querySelectorAll(".sb").forEach(b=>b.setAttribute("aria-pressed",b.dataset.b===S.buy));$("#order").hidden=!S.buy;
  if(S.buy){const B=SHOP[S.buy],t=TT[SRC(S.buy)],sh=B.ship(t.buy),tot=t.buy+sh,ok=t.buy>=B.min;$("#tots").innerHTML=`<div class="tot on"><span>${B.n} · productos</span><b>${eur(t.buy)}</b><small>${t.miss?(t.miss>1?`faltan ${t.miss} precios`:"falta 1 precio"):"todo con precio"}</small></div><div class="tot"><span>${B.lab||"Envío a domicilio"}</span><b>${sh?eur(sh):"Gratis"}</b><small>${B.note}</small></div><div class="tot best"><span>Total del pedido</span><b>${eur(tot)}</b><small>${!B.min?"sin pedido mínimo":ok?"supera el mínimo de "+B.min+" €":`<span class="warn">no llega al mínimo de ${B.min} €</span>`}</small></div>`}
  else $("#tots").innerHTML=SH.map(([s,n])=>{const t=TT[s];return`<button class="tot${md===s?" on":""}" data-s="${s}" role="tab" aria-selected="${md===s}"><span>${n}</span><b>${t.n?eur(t.buy):"—"}</b><small>${t.miss?(t.n?(t.miss>1?`faltan ${t.miss} precios`:"falta 1 precio"):"sin precios: añádelos"):"todo con precio"}</small></button>`}).join("")+`<button class="tot best${md==="best"?" on":""}" data-s="best" role="tab" aria-selected="${md==="best"}"><span>Lo más barato</span><b>${eur(TT.best.buy)}</b><small>${TT.best.shops.map(s=>SHN[s]).join(" + ")||"—"}${TT.best.miss?` · ${TT.best.miss} sin precio`:""}</small></button>`;
  const cur=md==="best"?TT.best:TT[md];
  $("#fine").innerHTML=`Pagas <b>${eur(cur.buy)}</b> comprando paquetes enteros; lo que consumes esta semana vale unos <b>${eur(cur.use)}</b> (el resto queda en la despensa). Precios de las tiendas online del ${PXD}: Mercadona para el código postal 47001, Carrefour con su precio online. Lidl no publica su surtido con precios en la web: toca un precio para añadir los suyos o corregir cualquiera. <button class="lnk" id="pxreset">Restaurar precios</button>`;
  if(S.buy)$("#fine").innerHTML=`Pagas <b>${eur(cur.buy)}</b> en productos comprando paquetes enteros; lo que consumes esta semana vale unos <b>${eur(cur.use)}</b>. Precios de ${SHOP[S.buy].web}${S.buy==="d"?" (la recogida Drive no cobra envío; elige tu tienda Drive en su web)":""}${S.buy==="m"?" para el código postal 47001":""} del ${PXD}; el envío es orientativo y la web confirma el importe; los productos sin precio no están en su web (toca “añadir” para poner uno o cámbialos en tus preferencias). <button class="lnk" id="pxreset">Restaurar precios</button>`;
  const li=x=>{const c=md==="best"?x.best:x.cs[md];const r=c?c.r:null;return`<li><label class="${ch[x.k]?"done":""}"><input type="checkbox" data-k="${x.k}"${ch[x.k]?" checked":""}><span class="nm">${x.n}<small>${fq(x.q,x.u)}${r?" · "+r[3]:""}</small></span></label><button class="pe${c?"":" none"}" data-n="${x.n}" aria-label="Editar precio de ${x.n}">${c?eur(c.buy):"añadir"}</button></li>`};
  const grp=(h,g)=>g.length?`<div class="grp"><h3>${h}</h3><ul>${g.sort((a,b)=>a.n.localeCompare(b.n,"es")).map(li).join("")}</ul></div>`:"";
  const sum=g=>eur(g.reduce((s,x)=>s+(md==="best"?x.best:x.cs[md]).buy,0));
  let html;
  if(md==="best"){
    html=SH.map(([s,n])=>{const g=PL.filter(x=>x.best&&x.bs===s);return g.length?grp(`${n} · ${sum(g)}`,g):""}).join("")+grp("Sin precio en ningún súper",PL.filter(x=>!x.best));
  }else html=CATS.map(([c,l])=>grp(l,PL.filter(x=>x.c===c))).join("");
  $("#shop").innerHTML=html+`<div class="grp"><h3>Revisa la despensa</h3><div class="pantry">${PANTRY.map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`;
  $("#undo").disabled=!S.prev;
}
const dlg=$("#dlg");
function openR(id,m,i){
  const r=R[id];
  dlg.innerHTML=`<div class="dh"><span class="k"><i style="background:${T[r.t][1]}"></i>${T[r.t][0]} · ${m==="l"?"Comida":"Cena"} · ${r.min} min · 1 ración</span><h3>${r.n}</h3></div><div class="db"><div><h4>Ingredientes</h4><ul>${r.ing.map(g=>`<li><span>${g.n}</span><span class="q">${fr(g.q,g.u)}</span></li>`).join("")}<li class="pt">Más aceite, sal y especias de la despensa</li></ul></div><div><h4>Preparación</h4><p>${r.s}</p></div></div><div class="df"><button class="sec" id="dsw" data-m="${m}" data-i="${i}">Cambiar por otro plato</button><button class="pri" id="dclose">Cerrar</button></div>`;
  if(!dlg.open){try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}}
}
function swap(m,i){
  const wk=S.plan.weeks[W],id=wk[m][i],u=used();
  const ids=pool(m,R[id].t);
  let cand=ids.filter(x=>!u.has(x));if(!cand.length)cand=ids.filter(x=>x!==id);
  if(!cand.length){toast("No hay otra opción con tus preferencias");return id}
  wk[m][i]=cand[Math.random()*cand.length|0];save();render();toast("Plato cambiado");return wk[m][i];
}
const xdlg=$("#xdlg");
function openX(n){
  const it=priced(W).find(x=>x.n===n);if(!it)return;
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const un={g:"g",ml:"ml",ud:"ud",lata:"latas",manojo:"manojos"}[it.u]||it.u;
  xdlg.dataset.n=n;
  xdlg.innerHTML=`<div class="dh"><span class="k" style="margin-top:0">Esta semana necesitas ${fq(it.q,it.u)}</span><h3>${n}</h3></div><div class="pb">
  <p class="hint">Precio del paquete y cuánto trae (en ${un}). Si se vende al peso, marca la casilla y se cobra solo lo que necesitas; si no, se compran paquetes enteros. Deja el precio vacío si ese súper no lo tiene.</p>
  ${SH.map(([s,sn])=>{const r=price(s,n)||[0,0,0,""];return`<fieldset class="xr"><legend>${sn}${it.cs[s]?` · ${eur(it.cs[s].buy)}`:""}</legend>
  <label>Precio (€)<input data-x="${s}p" inputmode="decimal" value="${r[0]?String(r[0]).replace(".",","):""}"></label>
  <label>Trae (${un})<input data-x="${s}q" inputmode="decimal" value="${r[1]||""}"></label>
  <label class="cb"><input type="checkbox" data-x="${s}w"${r[2]?" checked":""}> Al peso</label>
  <label class="wide">Producto<input data-x="${s}l" value="${esc(r[3])}"></label></fieldset>`}).join("")}</div>
  <div class="df"><button class="sec" id="xreset">Restaurar original</button><button class="sec" id="xclose">Cancelar</button><button class="pri" id="xsave">Guardar</button></div>`;
  try{xdlg.showModal()}catch(e){xdlg.setAttribute("open","")}
}
xdlg.addEventListener("click",e=>{if(e.target===xdlg)xdlg.close()});
const pdlg=$("#pdlg");let D=null;
const TOTAL=Object.keys(R).length;
function chipI(n){const st=D.no.includes(n)?"no":D.si.includes(n)?"si":"";return`<button class="pg ${st}" data-n="${n}" aria-label="${n}${st==="no"?", no me gusta":st==="si"?", me gusta":""}">${st==="no"?"✕ ":st==="si"?"✓ ":""}${n}</button>`}
function drawI(){const q=nz(($("#pq")||{}).value||"");$("#pi").innerHTML=ALLING.filter(n=>!q||nz(n).includes(q)).map(chipI).join("")||`<span class="hint">Ningún ingrediente coincide.</span>`}
function countP(){const n=Object.keys(R).filter(id=>!blocked(R[id],D)).length;$("#pn").innerHTML=`Platos disponibles: <b>${n}</b> de ${TOTAL}`+(n<45?` · <span class="warn">algunos se repetirán en el mes</span>`:"")}
function openP(){
  D=JSON.parse(JSON.stringify(S.prefs));
  const tg=k=>`<button class="pt${D.al.includes(k)?" on":""}" data-a="${k}" aria-pressed="${D.al.includes(k)}">${RU[k].l}</button>`;
  pdlg.innerHTML=`<div class="dh"><h3>Mis preferencias</h3><span class="k" style="margin-top:6px">Los platos con lo que marques no saldrán en el menú ni en la lista de la compra.</span></div>
  <div class="pb"><h4>Alergias e intolerancias</h4><div class="pc">${AL.map(tg).join("")}</div>
  <h4>Dieta</h4><div class="pc">${DI.map(tg).join("")}</div>
  <h4>Ingredientes</h4><p class="hint">Un toque: no me gusta (se excluye). Dos toques: me gusta (saldrá más a menudo). Tres: neutral.</p>
  <input id="pq" type="search" placeholder="Buscar ingrediente" autocomplete="off"><div class="pc" id="pi"></div>
  <h4>Otras palabras a evitar</h4><p class="hint">Separadas por comas; se buscan en el nombre, los ingredientes y la preparación.</p>
  <input id="pw" type="text" placeholder="Por ejemplo: picante, setas, aguacate" value="${D.words.replace(/"/g,"&quot;")}">
  <p class="hint">Con alergias reales, revisa siempre las etiquetas: caldos, embutidos, salsas y especias pueden llevar trazas.</p></div>
  <div class="df"><span class="pn" id="pn"></span><button class="sec" id="pcancel">Cancelar</button><button class="pri" id="psave">Guardar y rehacer menú</button></div>`;
  drawI();countP();
  try{pdlg.showModal()}catch(e){pdlg.setAttribute("open","")}
}
pdlg.addEventListener("click",e=>{if(e.target===pdlg)pdlg.close()});
pdlg.addEventListener("input",e=>{if(e.target.id==="pq")drawI();if(e.target.id==="pw"){D.words=e.target.value;countP()}});
let tt;const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)};
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("tab")){W=+t.dataset.w;render();return}
  if(t.classList.contains("meal")){openR(t.dataset.id,t.dataset.m,+t.dataset.i);return}
  if(t.classList.contains("sw")){swap(t.dataset.m,+t.dataset.i);return}
  if(t.id==="prefs"){openP();return}
  if(t.classList.contains("pt")){const a=t.dataset.a;D.al=D.al.includes(a)?D.al.filter(x=>x!==a):D.al.concat(a);t.classList.toggle("on");t.setAttribute("aria-pressed",t.classList.contains("on"));countP();return}
  if(t.classList.contains("pg")){const n=t.dataset.n;const st=D.no.includes(n)?"no":D.si.includes(n)?"si":"";D.no=D.no.filter(x=>x!==n);D.si=D.si.filter(x=>x!==n);const nx=st===""?"no":st==="no"?"si":"";if(nx)D[nx].push(n);t.outerHTML=chipI(n);countP();return}
  if(t.id==="pcancel"){pdlg.close();return}
  if(t.id==="psave"){S.prefs=D;S.prev=S.plan;S.plan=gen(used());S.checks={};W=0;save();pdlg.close();render(true);toast("Preferencias guardadas y menú rehecho");return}
  if(t.id==="dsw"){const m=t.dataset.m,i=+t.dataset.i;openR(swap(m,i),m,i);return}
  if(t.id==="dclose"){dlg.close();return}
  if(t.id==="mix"){S.prev=S.plan;S.plan=gen(used());S.checks={};W=0;save();render(true);toast("Nuevo mes generado, priorizando platos que no salieron");return}
  if(t.id==="undo"&&S.prev){[S.plan,S.prev]=[S.prev,S.plan];S.checks={};W=0;save();render(true);toast("Menú anterior recuperado");return}
  if(t.id==="clear"){S.checks[W]={};save();render();return}
  if(t.classList.contains("tot")){S.mode=t.dataset.s;save();render();return}
  if(t.classList.contains("pe")){openX(t.dataset.n);return}
  if(t.id==="xclose"){xdlg.close();return}
  if(t.id==="xreset"){for(const[s]of SH)if(S.px[s])delete S.px[s][xdlg.dataset.n];save();xdlg.close();render();toast("Precio original restaurado");return}
  if(t.id==="xsave"){
    const n=xdlg.dataset.n;
    for(const[s]of SH){const g=k=>xdlg.querySelector(`[data-x="${s}${k}"]`);const p=parseFloat(String(g("p").value).replace(",","."));const q=parseFloat(String(g("q").value).replace(",","."));
      S.px[s]=S.px[s]||{};S.px[s][n]=p>0&&q>0?[p,q,g("w").checked?1:0,g("l").value.trim()||"Precio introducido por ti"]:[0,1,0,""]}
    save();xdlg.close();render();toast("Precios guardados");return}
  if(t.classList.contains("sb")){S.buy=t.dataset.b;save();render();return}
  if(t.id==="order"){
    const PL=priced(W),TT=totals(PL);
    const bb=S.buy||"m",b=SRC(bb),B=SHOP[bb],sh=B.ship(TT[b].buy);const ln=x=>{const c=x.cs[b];if(!c)return`- ${x.n}: ${fq(x.q,x.u)} · SIN PRODUCTO EN ${B.n.toUpperCase()}`;const[p,q,w,l]=c.r;return w?`- ${l}: ${fq(x.q,x.u)} al peso (≈${eur(c.buy)})`:`- ${Math.ceil(x.q/q-1e-9)} × ${l} (${eur(p)} c/u = ${eur(c.buy)})`};
    const txt=`Pedido ${B.n} · semana ${W+1} (${fd(dateOf(W,0))} – ${fd(dateOf(W,6))})\nProductos: ${eur(TT[b].buy)} + ${bb==="d"?"recogida Drive":"envío"} ${eur(sh)} = ${eur(TT[b].buy+sh)}\n\n`+PL.slice().sort((a,b)=>a.n.localeCompare(b.n,"es")).map(ln).join("\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Pedido copiado"),()=>toast("No se pudo copiar"));return}
  if(t.id==="pxreset"){S.px={};save();render();toast("Precios originales restaurados");return}
  if(t.id==="copy"){
    const PL=priced(W),md=S.buy?SRC(S.buy):S.mode,TT=totals(PL),C=x=>md==="best"?x.best:x.cs[md];
    const ln=x=>{const c=C(x);return`- ${x.n}: ${fq(x.q,x.u)}${c?` · ${eur(c.buy)} (${c.r[3]})`:""}`};
    const blk=(h,g)=>g.length?`\n${h}\n`+g.sort((a,b)=>a.n.localeCompare(b.n,"es")).map(ln).join("\n"):"";
    const body=md==="best"?SH.map(([s,n])=>blk(n,PL.filter(x=>x.best&&x.bs===s))).join("\n")+blk("Sin precio",PL.filter(x=>!x.best)):CATS.map(([c,l])=>blk(l,PL.filter(x=>x.c===c))).join("\n");
    const txt=`Lista de la compra · semana ${W+1} (${fd(dateOf(W,0))} – ${fd(dateOf(W,6))}) · ${md==="best"?"lo más barato":SHN[md]} · total ${eur((md==="best"?TT.best:TT[md]).buy)}\n`+body;
    navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada"),()=>toast("No se pudo copiar"));
  }
});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.addEventListener("change",e=>{
  const c=e.target;if(!c.dataset||!c.dataset.k)return;
  (S.checks[W]=S.checks[W]||{})[c.dataset.k]=c.checked;c.closest("label").classList.toggle("done",c.checked);save();
});
save();render();
let dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("#inst").classList.add("show")});
window.addEventListener("appinstalled",()=>{$("#inst").classList.remove("show");toast("App instalada")});
$("#inst").addEventListener("click",async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$("#inst").classList.remove("show")});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
